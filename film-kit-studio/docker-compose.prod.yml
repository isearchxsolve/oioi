# ─────────────────────────────────────────────────────────────────
# DOCKER COMPOSE - Production
# ─────────────────────────────────────────────────────────────────
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: film-kit-postgres-prod
    environment:
      POSTGRES_USER: film_kit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: film_kit_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_kit -d film_kit_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: film-kit-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/film-kit-studio-backend:latest
    container_name: film-kit-backend-prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://film_kit:${POSTGRES_PASSWORD}@postgres:5432/film_kit_studio
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=https://your-domain.com
      - NIM_API_KEY=${NIM_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - KLING_API_KEY=${KLING_API_KEY}
      - KLING_API_SECRET=${KLING_API_SECRET}
      - SUNO_API_KEY=${SUNO_API_KEY}
      - SUNO_BASE_URL=${SUNO_BASE_URL}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - projects_data:/app/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/film-kit-studio-frontend:latest
    container_name: film-kit-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=https://your-domain.com/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: nginx:alpine
    container_name: film-kit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    deploy:
      restart_policy:
        condition: on-failure

  certbot:
    image: certbot/certbot
    container_name: film-kit-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:
  projects_data:
  certbot_etc:
  certbot_www: