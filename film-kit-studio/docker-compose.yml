# ─────────────────────────────────────────────────────────────────
# DOCKER COMPOSE - Local Development
# ─────────────────────────────────────────────────────────────────
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: film-kit-postgres
    environment:
      POSTGRES_USER: film_kit
      POSTGRES_PASSWORD: film_kit_dev
      POSTGRES_DB: film_kit_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_kit -d film_kit_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: film-kit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: film-kit-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://film_kit:film_kit_dev@postgres:5432/film_kit_studio
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - NIM_API_KEY=${NIM_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - KLING_API_KEY=${KLING_API_KEY:-}
      - KLING_API_SECRET=${KLING_API_SECRET:-}
      - SUNO_API_KEY=${SUNO_API_KEY:-}
      - SUNO_BASE_URL=${SUNO_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./projects:/app/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: film-kit-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data: